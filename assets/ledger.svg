<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 372" width="860" height="372" role="img" aria-label="Selected work: ORCA, marine safety advisory, a refusal you can audit. Causa, microservice root-cause, a verdict you can defend. welp, shell failure triage, rules not guesses. the house, compositor shell, a scope it states out loud. Replay Trader, market replay, same inputs same session. bjak, six-deck blackjack, an edge measured not claimed.">
